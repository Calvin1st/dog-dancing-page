  <circle cx="85" cy="88" r="8" fill="#2D1A0A" />
  <circle cx="88" cy="85" r="3" fill="white" />
  <circle cx="85" cy="88" r="2" fill="#1A0A00" />

  <!-- 눈 오른쪽 -->
