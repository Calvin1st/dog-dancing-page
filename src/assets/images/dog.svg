  <ellipse cx="97" cy="101" rx="3" ry="2" fill="#4A3020" />

  <!-- 입 -->
  <path d="M 88 112 Q 100 122 112 112" stroke="#2D1A0A" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- 혀 -->
  <ellipse cx="100" cy="120" rx="9" ry="7" fill="#FF6B6B" />
  <line x1="100" y1="115" x2="100" y2="127" stroke="#E05555" stroke-width="1.5" />

