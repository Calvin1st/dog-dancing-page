<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- 꼬리 -->
  <g class="tail">
    <ellipse cx="155" cy="170" rx="12" ry="7" fill="#C8A26A" transform="rotate(-30 155 170)" />
    <ellipse cx="168" cy="158" rx="10" ry="6" fill="#C8A26A" transform="rotate(-50 168 158)" />
    <ellipse cx="178" cy="145" rx="8" ry="5" fill="#C8A26A" transform="rotate(-70 178 145)" />
  </g>

  <!-- 몸통 -->
  <ellipse cx="100" cy="165" rx="55" ry="50" fill="#D4A96A" />

  <!-- 앞다리 왼쪽 -->
  <rect x="58" y="195" width="22" height="38" rx="11" fill="#C8A26A" />
  <ellipse cx="69" cy="233" rx="13" ry="8" fill="#B8916A" />

